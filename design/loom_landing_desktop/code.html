<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Loom - Premium Distributed Commerce</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&amp;family=Public+Sans:wght@600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-tertiary": "#1d00a5",
                        "on-tertiary-container": "#6c66ff",
                        "outline-variant": "#46464a",
                        "outline": "#919094",
                        "on-primary-fixed-variant": "#474647",
                        "primary": "#c8c6c7",
                        "secondary-fixed-dim": "#c6c6c7",
                        "on-primary": "#313031",
                        "primary-fixed": "#e5e2e3",
                        "surface-container-high": "#2a2a2d",
                        "on-error": "#690005",
                        "on-tertiary-fixed": "#0f0069",
                        "on-secondary": "#2f3131",
                        "secondary-fixed": "#e2e2e2",
                        "on-surface-variant": "#c7c6ca",
                        "tertiary-fixed": "#e2dfff",
                        "inverse-on-surface": "#303033",
                        "surface": "#131316",
                        "surface-container-highest": "#353437",
                        "surface-variant": "#353437",
                        "on-tertiary-fixed-variant": "#3323cc",
                        "secondary": "#c6c6c7",
                        "surface-bright": "#39393c",
                        "background": "#131316",
                        "surface-container-low": "#1b1b1e",
                        "inverse-primary": "#5f5e5f",
                        "inverse-surface": "#e4e1e5",
                        "on-secondary-container": "#b4b5b5",
                        "on-secondary-fixed": "#1a1c1c",
                        "surface-dim": "#131316",
                        "error-container": "#93000a",
                        "on-surface": "#e4e1e5",
                        "primary-container": "#0f0f10",
                        "error": "#ffb4ab",
                        "on-primary-fixed": "#1c1b1c",
                        "tertiary": "#c3c0ff",
                        "surface-container-lowest": "#0e0e11",
                        "tertiary-container": "#060046",
                        "primary-fixed-dim": "#c8c6c7",
                        "surface-tint": "#c8c6c7",
                        "on-secondary-fixed-variant": "#454747",
                        "on-background": "#e4e1e5",
                        "on-primary-container": "#7d7b7c",
                        "tertiary-fixed-dim": "#c3c0ff",
                        "surface-container": "#1f1f22",
                        "on-error-container": "#ffdad6",
                        "secondary-container": "#454747"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "grid-gutter": "20px",
                        "stack-lg": "32px",
                        "grid-margin": "40px",
                        "stack-md": "16px",
                        "container-max": "1440px",
                        "stack-sm": "8px",
                        "stack-xs": "4px"
                    },
                    "fontFamily": {
                        "label-caps": ["Inter"],
                        "body-sm": ["Inter"],
                        "body-lg": ["Inter"],
                        "headline-md": ["Public Sans"],
                        "display-lg": ["Public Sans"],
                        "data-mono": ["Inter"],
                        "display-lg-mobile": ["Public Sans"]
                    },
                    "fontSize": {
                        "label-caps": ["11px", { "lineHeight": "1.2", "letterSpacing": "0.1em", "fontWeight": "600" }],

                        "body-lg": ["16px", { "lineHeight": "1.6", "letterSpacing": "-0.01em", "fontWeight": "400" }],

                }
            }
        }

<style>
        .glass-panel {
            background: rgba(19, 19, 22, 0.4);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(228, 225, 229, 0.1);
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen relative overflow-hidden font-body-lg">
<!-- Background Animation -->
<div class="fixed inset-0 z-0">

<!-- Fallback/Overlay for contrast -->
<div class="absolute inset-0 bg-gradient-to-b from-background/80 via-background/40 to-background/90 z-10 pointer-events-none"></div>
</div>
<!-- Navigation Shell (TopNavBar) -->
<!-- Content: Linear/Transactional Intent -> TopNav is technically suppressed for Landing Pages per rules, but the prompt specifically requested a Minimal TopNavBar. We will render a highly simplified version avoiding full global navigation to respect the "Destination Rule" while fulfilling the prompt. -->
<nav class="fixed top-0 w-full z-50 px-grid-margin py-stack-md glass-panel border-b-0 border-outline-variant flex justify-between items-center max-w-container-max mx-auto left-0 right-0">
<div class="flex items-center gap-stack-lg">
<span class="font-display-lg-mobile text-display-lg-mobile font-bold tracking-tighter text-on-surface">LOOM</span>
<!-- Hidden on mobile, flex on desktop -->
<div class="hidden md:flex gap-stack-lg ml-grid-margin">
<a class="font-label-caps text-label-caps text-on-surface border-b-2 border-on-surface pb-1 opacity-80 hover:text-on-surface transition-colors duration-200" href="#">Catalog</a>
</div>
</div>
<div class="flex items-center gap-stack-md">
<a class="font-label-caps text-label-caps text-on-surface-variant hover:text-on-surface transition-colors duration-200" href="#">Sign In</a>
<button class="bg-tertiary-container text-on-tertiary-container font-label-caps text-label-caps px-4 py-2 rounded hover:opacity-90 transition-opacity">Launch Workspace</button>
</div>
</nav>
<!-- Main Content Canvas -->
<main class="relative z-20 min-h-screen flex flex-col justify-center items-center px-grid-margin pt-24 pb-stack-lg text-center max-w-container-max mx-auto">
<div class="max-w-3xl glass-panel p-stack-lg md:p-12 rounded-xl flex flex-col items-center gap-stack-lg">
<!-- Hero Typography -->
<h1 class="font-display-lg text-display-lg-mobile md:text-display-lg text-on-surface mb-stack-sm drop-shadow-lg">
                LOOM
            </h1>
<h2 class="font-headline-md text-headline-md text-on-surface-variant mb-stack-md max-w-2xl">
                The Future of Distributed Commerce.
            </h2>
<!-- Body Copy -->
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-xl mb-stack-lg opacity-90 leading-relaxed">
                Discover products, curate your catalog, and launch your business with a single click. Loom connects sellers to a premium product network with transparent commission-driven growth.
            </p>
<!-- Call to Actions -->
<div class="flex flex-col sm:flex-row gap-stack-md w-full sm:w-auto justify-center">
<button class="bg-tertiary-container text-on-tertiary-container font-label-caps text-label-caps px-8 py-4 rounded hover:bg-tertiary hover:text-on-tertiary transition-all duration-300 w-full sm:w-auto uppercase tracking-widest">
                    Get Started
                </button>
<button class="bg-transparent border border-outline-variant text-on-surface font-label-caps text-label-caps px-8 py-4 rounded hover:bg-surface-container-high transition-all duration-300 w-full sm:w-auto uppercase tracking-widest">
                    Sign In
                </button>
</div>
</div>
</main>
<!-- Footer - Hidden as this is a focused landing/transactional entry point, adhering to shell relevance rules. -->
</body></html>
