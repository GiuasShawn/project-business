<input class="bg-surface border border-outline-variant text-on-surface font-body-lg text-body-lg rounded px-4 py-3 focus:border-tertiary-container focus:ring-1 focus:ring-tertiary-container transition-colors outline-none w-full" id="email" name="email" placeholder="name@example.com" required="" type="email"/>
</div>
<div class="flex flex-col gap-stack-xs">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase" for="password">Password</label>
<input class="bg-surface border border-outline-variant text-on-surface font-body-lg text-body-lg rounded px-4 py-3 focus:border-tertiary-container focus:ring-1 focus:ring-tertiary-container transition-colors outline-none w-full" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
<button class="w-full bg-on-tertiary text-on-primary font-label-caps text-label-caps uppercase py-4 rounded hover:opacity-90 transition-opacity mt-stack-xs" type="submit">
                Sign In
            </button>
</form>
<div class="flex items-center gap-4">
<div class="h-px bg-outline-variant flex-1"></div>
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase">Or</span>

</div>
